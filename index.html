<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Website</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #5f5f8u, #d1a700);
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        h1 {
            font-size: 4em;
            text-align: center;
            animation: neonGlow 1.5s ease-in-out infinite;
        }
        @keyframes neonGlow {
            0%, 100% {
                text-shadow: 0 0 5px #d1a700, 0 0 10px #d1a700, 0 0 20px #5f5f8u;
            }
            50% {
                text-shadow: 0 0 20px #d1a700, 0 0 30px #5f5f8u, 0 0 40px #d1a700;
            }
        }
        .leaderboard {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            margin: 20px;
            text-align: center;
        }
        .current-king {
            font-size: 2em;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .social-links {
            text-align: center;
            margin: 20px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Smooth scrolling for navigation
            const links = document.querySelectorAll('a[href^="#"]');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    target.scrollIntoView({ behavior: 'smooth' });
                });
            });

            // Copy to clipboard functionality
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.addEventListener('click', function() {
                const serverDetails = document.querySelector('.server-details');
                navigator.clipboard.writeText(serverDetails.textContent).then(() => {
                    alert('Server details copied to clipboard!');
                });
            });
        });
    </script>
</head>
<body>
    <h1>Welcome to the Neon Gaming Hub</h1>
    <div class="leaderboard">
        <h2>Leaderboard</h2>
        <ul>
            <li>User1: 1000 Points</li>
            <li>User2: 900 Points</li>
            <li>User3: 800 Points</li>
        </ul>
    </div>
    <div class="current-king">
        <h2>👑 Current King: User1</h2>
    </div>
    <div class="server-details">
        <p>Server IP: 123.456.789.0</p>
        <button class="copy-btn">Copy Server Details</button>
    </div>
    <div class="social-links">
        <h3>Connect with Us</h3>
        <a href="https://discord.gg/w26bEKXBVx">Discord</a>
    </div>
    <script>
        // Smooth scrolling for navigation
    </script>
</body>
</html>
